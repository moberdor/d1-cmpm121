<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bee Clicker game</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <h1 id="game-title"></h1>

      <button id="bee-button" aria-label="Get honey">🐝</button>
      <p id="honey-display"></p>
      <p id="bee-display"></p>
      <p id="rate-display"></p>

      <div class="upgrade" id="worker-card">
        <h2 id="worker-name"></h2>
        <p id="worker-gain"></p>
        <div class="upgrade-emoji" id="worker-emoji"></div>
        <p class="upgrade-owned" id="worker-owned"></p>
        <p>Cost: <strong id="worker-cost"></strong></p>
        <button>Buy</button>
      </div>

      <div class="upgrade" id="office-card" style="display: none">
        <h2 id="office-name"></h2>
        <p id="office-gain"></p>
        <div class="upgrade-emoji" id="office-emoji"></div>
        <p class="upgrade-owned" id="office-owned"></p>
        <p>Cost: <strong id="office-cost"></strong></p>
        <button>Buy</button>
      </div>

      <div class="upgrade" id="keeper-card" style="display: none">
        <h2 id="keeper-name"></h2>
        <p id="keeper-gain-per-s"></p>
        <div class="upgrade-emoji" id="keeper-emoji"></div>
        <p class="upgrade-owned" id="keeper-owned"></p>
        <p>Cost: <strong id="keeper-cost"></strong></p>
        <button>Buy</button>
      </div>

      <div class="upgrade" id="queen-card" style="display: none">
        <h2 id="queen-name"></h2>
        <p id="queen-gain-per-s"></p>
        <div class="upgrade-emoji" id="queen-emoji"></div>
        <p class="upgrade-owned" id="queen-owned"></p>
        <p>Cost: <strong id="queen-cost"></strong></p>
        <button>Buy</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
